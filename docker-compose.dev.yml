services:
  speech-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: speech-service:dev
    container_name: speech-service-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      LOG_JSON: "false"
      LOG_LEVEL: "DEBUG"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    volumes:
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    extra_hosts:
      - "headproxy03:172.23.6.160"
    networks:
      - speech-net

networks:
  speech-net:
    driver: bridge
