apiVersion: v1
kind: ConfigMap
metadata:
  name: speech-service-config
  namespace: speech-service
data:
  DEFAULT_STT_ENGINE: "yandex"
  DEFAULT_TTS_ENGINE: "yandex"
  YANDEX_STT_URL: "https://stt.api.yandexcloud.kz/stt/v3/recognizeFileAsync"
  YANDEX_TTS_URL: "https://tts.api.yandexcloud.kz/tts/v3/utteranceSynthesis"
  YANDEX_TIMEOUT: "120"
  YANDEX_SSL_VERIFY: "true"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  REDIS_URL: "redis://redis:6379/2"
  CELERY_QUEUE: "speech_queue"
  UPLOAD_DIR: "/app/uploads"
  API_KEY_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_MAX_REQUESTS: "60"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  DEDUP_ENABLED: "true"
