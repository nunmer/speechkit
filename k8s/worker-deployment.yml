apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-worker
  namespace: speech-service
  labels:
    app.kubernetes.io/name: speech-worker
    app.kubernetes.io/version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: speech-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: speech-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: speech-service:latest
          imagePullPolicy: IfNotPresent
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: speech-service-config
            - secretRef:
                name: speech-service-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: speech-uploads
