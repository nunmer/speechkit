groups:
  - name: speech-service
    rules:
      - alert: HighRequestErrorRate
        expr: |
          sum(rate(speech_requests_total{status_code=~"5.."}[5m]))
            / sum(rate(speech_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on speech API"
          description: "More than 5% of requests are failing over the last 5m."

      - alert: EngineErrorsSpike
        expr: sum(rate(speech_engine_errors_total[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Upstream engine errors elevated"
          description: "Engine error rate is elevated over the last 10m."

      - alert: STTJobFailureRate
        expr: |
          sum(rate(speech_jobs_total{status="failed"}[10m]))
            / clamp_min(sum(rate(speech_jobs_total[10m])), 0.001) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "STT job failure rate high"
          description: "More than 10% of async STT jobs are failing."

      - alert: SlowRequests
        expr: |
          histogram_quantile(0.95, sum(rate(speech_request_duration_seconds_bucket[5m])) by (le)) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 request latency above 30s"
          description: "Long synchronous requests — consider the async endpoints."
